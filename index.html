<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네른스트 방정식 기반 다종 수의 체액 전해질 농도 측정 및 상태 진단 프로그램</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; }
        .card { max-width: 520px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; font-size: 20px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
        button { background-color: #27ae60; color: white; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🩺 네른스트 방정식 기반 다종 수의 체액 전해질 농도 측정 및 상태 진단 프로그램</h2>
        
        <label for="species">1. 진단 대상 동물 선택</label>
        <select id="species">
            <option value="1">🐶 개 (Canine)</option>
            <option value="2">🐱 고양이 (Feline)</option>
            <option value="3">🐮 소/송아지 (Bovine)</option>
            <option value="4">🐯 호랑이/사자 (Panthera)</option>
            <option value="5">🐵 침팬지 (Chimpanzee)</option>
            <option value="6">🐘 코끼리 (Elephant)</option>
            <option value="7">🦒 기린 (Giraffe)</option>
            <option value="8">🦜 앵무새 (Psittacine)</option>
            <option value="9">🐢 바다거북 (Sea Turtle)</option>
            <option value="10">🐬 남방큰돌고래 (Dolphin)</option>
        </select>

        <label for="ion">2. 측정 전해질 이온 선택</label>
        <select id="ion">
            <option value="K">칼륨 (K⁺) - 심장/근육 응급</option>
            <option value="Na">나트륨 (Na⁺) - 체수분/삼투압/신경</option>
            <option value="Cl">염소 (Cl⁻) - 산-염기/체액 평형</option>
        </select>

        <label for="voltage">3. Pasco 전압 센서 실측값 (mV)</label>
        <input type="number" id="voltage" placeholder="예: 135" value="135">

        <button onclick="diagnose()">진단하기</button>

        <div id="result"></div>
    </div>

    <script>
        // 동물별 Na / K / Cl 정상 생리 참고치 데이터베이스 (mEq/L)
        const db = {
            "1": { name: "개 (Canine)", K: {min: 3.5, max: 5.5, note: "FLUTD/심장 질환 및 심정지 위험"}, Na: {min: 140, max: 155, note: "뇌부종 및 심한 탈수 주의"}, Cl: {min: 105, max: 120, note: "대사성 산증/알칼리증 모니터링"} },
            "2": { name: "고양이 (Feline)", K: {min: 3.5, max: 5.8, note: "요도 폐색 관련 고칼륨혈증 주의"}, Na: {min: 147, max: 157, note: "고나트륨혈증성 신경 증상 주의"}, Cl: {min: 115, max: 130, note: "신부전 및 체액 불균형 주의"} },
            "3": { name: "소/송아지 (Bovine)", K: {min: 3.9, max: 5.3, note: "설사성 탈수 교정 필요"}, Na: {min: 132, max: 152, note: "송아지 대사성 이상 확인"}, Cl: {min: 95, max: 110, note: "위장관 폐색/변위 모니터링"} },
            "4": { name: "호랑이/사자 (Panthera)", K: {min: 3.8, max: 5.2, note: "마취 중 산증 모니터링"}, Na: {min: 142, max: 156, note: "포획 스트레스 탈수 확인"}, Cl: {min: 108, max: 122, note: "전해질 균형 상태 체크"} },
            "5": { name: "침팬지 (Chimpanzee)", K: {min: 3.5, max: 5.1, note: "스트레스성 탈수 체크"}, Na: {min: 138, max: 148, note: "영장류 특이적 체수분 확인"}, Cl: {min: 100, max: 112, note: "체액 산-염기 이상 관찰"} },
            "6": { name: "코끼리 (Elephant)", K: {min: 3.6, max: 5.0, note: "거대 체구 수액 정밀 교정"}, Na: {min: 128, max: 142, note: "거대 체액 용적 변동 모니터링"}, Cl: {min: 90, max: 105, note: "특수 생리 신장 기능 평가"} },
            "7": { name: "기린 (Giraffe)", K: {min: 3.7, max: 5.3, note: "포획 근육 손상 위험"}, Na: {min: 135, max: 150, note: "고혈압/체액 순환 모니터링"}, Cl: {min: 100, max: 115, note: "근육 및 신경 항상성 모니터링"} },
            "8": { name: "앵무새 (Psittacine)", K: {min: 3.0, max: 4.5, note: "조류 특이적 저칼륨 참고치"}, Na: {min: 130, max: 145, note: "조류 신장 탈수 교정"}, Cl: {min: 98, max: 112, note: "조류 특이적 삼투압 모니터링"} },
            "9": { name: "바다거북 (Sea Turtle)", K: {min: 2.5, max: 4.0, note: "파충류 특이 참고치"}, Na: {min: 145, max: 165, note: "해양 환경 염분 조절 이상"}, Cl: {min: 110, max: 130, note: "염분 배출 샘 기능 평가"} },
            "10": { name: "남방큰돌고래 (Dolphin)", K: {min: 3.3, max: 4.7, note: "해양 포유류 탈수 체크"}, Na: {min: 150, max: 162, note: "고염분 환경 체수분 유지 평가"}, Cl: {min: 115, max: 128, note: "신장 삼투 조절 기능 평가"} }
        };

        function diagnose() {
            const speciesId = document.getElementById("species").value;
            const ion = document.getElementById("ion").value;
            const voltage = parseFloat(document.getElementById("voltage").value);
            const animal = db[speciesId];
            const target = animal[ion];

            if (isNaN(voltage)) {
                alert("올바른 전압 수치를 입력해주세요!");
                return;
            }

            // 네른스트 방정식 기반 이온별 환산 계산식
            let conc = 0;
            if (ion === 'K') {
                conc = (3.5 + (voltage / 100.0) * 2.0).toFixed(2);
            } else if (ion === 'Na') {
                conc = (130.0 + (voltage / 100.0) * 15.0).toFixed(1);
            } else if (ion === 'Cl') {
                conc = (90.0 + (voltage / 100.0) * 18.0).toFixed(1);
            }

            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";

            let ionName = ion === 'K' ? '칼륨 (K⁺)' : (ion === 'Na' ? '나트륨 (Na⁺)' : '염소 (Cl⁻)');
            let msg = `<b>[진단 대상]</b>: ${animal.name}<br>`;
            msg += `<b>[측정 이온]</b>: ${ionName}<br>`;
            msg += `<b>[네른스트 환산 농도]</b>: <b>${conc} mEq/L</b> (정상 참고치: ${target.min} ~ ${target.max})<br><hr style="border:0; border-top:1px solid #ccc; margin:10px 0;">`;

            if (parseFloat(conc) < target.min) {
                resultDiv.style.backgroundColor = "#fff3cd";
                resultDiv.style.border = "1px solid #ffeeba";
                msg += `⚠️ <b>[저${ionName.split(' ')[0]}혈증 경고]</b> 수치 저하! 생리적 반응 모니터링 필요.`;
            } else if (parseFloat(conc) >= target.min && parseFloat(conc) <= target.max) {
                resultDiv.style.backgroundColor = "#d4edda";
                resultDiv.style.border = "1px solid #c3e6cb";
                msg += `✅ <b>[정상]</b> 해당 이온의 전해질 평형 상태가 안정적입니다.`;
            } else {
                resultDiv.style.backgroundColor = "#f8d7da";
                resultDiv.style.border = "1px solid #f5c6cb";
                msg += `🚨 <b>[고${ionName.split(' ')[0]}혈증 응급!]</b> ${target.note}! 즉시 처치 필요.`;
            }

            resultDiv.innerHTML = msg;
        }
    </script>
</body>
</html>
